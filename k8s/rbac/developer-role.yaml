apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-role
  namespace: dev
rules:
 - apiGroups:
     - ""
   resources:
     - pods
     - pods/log
   verbs:
     - get
     - list
     - watch
 - apiGroups:
     - apps
   resources:
     - deployments
     - replicasets
   verbs:
     - get
     - list
     - watch
 - apiGroups:
     - ""
   resources:
     - services
     - configmaps
     - events
   verbs:
     - get
     - list
     - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-rolebinding
  namespace: dev
subjects:
  - kind: User
    name: gary.alarcon
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: developer-role
  apiGroup: rbac.authorization.k8s.io