apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: crud-backend-routing
  namespace: monitoring
spec:
  route:
    groupBy: ['alertname', 'namespace']
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h
    receiver: 'slack-warnings'
    routes:
      - matchers:
          - name: severity
            value: critical
        receiver: pagerduty-critical

inhibitRules:
  - sourceMatch:
      - name: alertname
        value: PodCrashLooping
    targetMatch:
      - name: alertname
        value: HighLatency
    equal: ['namespace']

receivers:
  - name: slack-warnings
    slackConfigs:
      - channel: '#alerts-dev'
        apiURL:
          name: slack-webhook-secret
          key: webhook-url
  - name: pagerduty-critical
    pagerdutyConfigs:
      - routingKey: YOUR-PAGERDUTY-KEY