name: Deploy - Build, Scan, Push y Update

on:
  push:
    branches: [ main ]
    paths: [ "apps/**" ] # Solo se ejecuta en cambios dentro de apps/
                            # Un cambio en infra/ o k8s/ No dispara este pipeline

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      
      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
           -t $ECR_REGISTRY/crud-backend:$IMAGE_TAG \
           -t $ECR_REGISTRY/crud-backend:latest \
           ./apps/backend
          echo "IMAGE=$ECR_REGISTRY/crud-backend:$IMAGE_TAG" >> $GITHUB_ENV
      
      - name: Trivy - scane de la imagen construida
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          exit-code: 1 # Si encuentra vulnerabilidades de alta o crítica, falla el job
          trivyignores: .trivyignore
          format: sarif # Formato SARIF para reportes de seguridad
          output: trivy-image-results.sarif
          cache: false
          trivy-version: v0.69.3# Fijamos la versión de Trivy para evitar que cambios futuros rompan el pipeline

      - name: Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}    
        run: |
          docker push $ECR_REGISTRY/crud-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/crud-backend:latest

      - name: Update image tag in deployment.yaml
        run: |
          sed -i "s|crud-backend:.*|crud-backend:$IMAGE_TAG|"\
            k8s/base/deployment.yaml

            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add k8s/base/deployment.yaml
            git commit -m "ci: deploy image $IMAGE_TAG [skip ci]"
            git push
            #[skip ci] para evitar que este commit dispare otro pipeline de CI

  smoke-test:
    runs-on: ubuntu-latest
    needs: build-scan-push
    steps:
      - uses: actions/checkout@v3

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name crud-cluster
            # crud-cluster es el nombre del cluster EKS que creamos en Terraform

      - name: Wait for ArgoCD to sync
        run: |
          echo "Waiting 3 minutes for ArgoCD to detect and sync the commit..."
          sleep 180

      - name: Verify rollout completed
        run: |
           kubectl rollout status deployment/crud-backend \
            -n dev --timeout=5m
        # Falla si el rolling update no completa en 5min
        # Eso indica que los pods nuevos no pasan las probes
      
      - name: Verify all pods are running
        run: |
          NOTREADY=$(kubectl get pods -n dev -l app=crud-backend \
            --no-headers | grep -v 'Running' | wc -l)
          if [ "$NOTREADY" -gt "0" ]; then
            echo "FAIL: $NOTREADY pods are not in Running state"
            kubectl get pods -n dev -l app=crud-backend
            exit 1
          fi
          echo "PASS: All pods are in Running"
    
      - name: Healt check via ALB
        run: |
           ALB=$(kubectl get ingress crud-backend -n dev \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
           echo "Testing: http://$ALB/healthz"
           STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://$ALB/healthz)
              if [ "$STATUS" != 200 ]; then
                echo "FAIL: Health check returned  HTTP $STATUS (expected 200)"
                exit 1
              fi
              echo "PASS: Health check returned HTTP $STATUS"