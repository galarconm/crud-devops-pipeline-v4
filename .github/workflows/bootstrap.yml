name: Bootstrap - ArgoCD and Load Balancer Controller

on:
  workflow_dispatch:

env:
  AWS_REGION: 'us-east-1'
  EKS_CLUSTER_NAME: 'crud-devops-pipeline-dev'

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        run: |
            aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify cluster is healthy
        run: |
          NOTREADY=$(kubectl get nodes --no-headers | grep -v "Ready" | wc -l)
          if [ "$NOTREADY" -gt 0 ]; then
            echo "ABORT: Cluster has $NOTREADY unhealthy nodes."
            kubectl get nodes
            exit 1
          fi
          echo " Cluster healthy - proceeding"

      - name: Install ArgoCD
        run: |
          kubectl create namespace argocd || true
          kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml \
            --server-side \
            --force-conflicts
          kubectl wait --for=condition=available --timeout=5m deployment/argocd-server -n argocd # Esperar a que ArgoCD esté listo antes de continuar
          kubectl get pods -n argocd

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: '1.12.2'

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Install AWS Load Balancer Controller
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo update
          LBC_ROLE_ARN=$(cd infra/environments/dev/addons && terraform init -input=false > /dev/null && terraform output -raw lbc_role_arn)
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=*${{ env.EKS_CLUSTER_NAME }}*" \
            --region ${{ env.AWS_REGION }} \
            --query 'Vpcs[0].VpcId' --output text)

          echo "LBC_ROLE_ARN=$LBC_ROLE_ARN"
          echo "VPC_ID=$VPC_ID"


          helm install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName=${{ env.EKS_CLUSTER_NAME }} \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=$LBC_ROLE_ARN" \
            --set region=${{ env.AWS_REGION }} \
            --set vpcId=$VPC_ID

          kubectl wait --for=condition=available --timeout=5m deployment/aws-load-balancer-controller -n kube-system
          kubectl get pods -n kube-system | grep aws-load-balancer-controller

      - name: Apply ArgoCD application manifests
        run: |
          kubectl apply -f k8s/argocd/

          echo "Waiting for ArgoCD to create the dev namespace..."
          for i in {1..30}; do
            if kubectl get namespace dev &> /dev/null; then
              echo "Namespace dev exists"
              break
            fi
            sleep 10
          done

          kubectl wait --for=condition=available --timeout=5m deployment/crud-backend-deployment -n dev
          kubectl get pods -n dev

      - name: Verify ArgoCD syncs
        run: |
          kubectl get applications -n argocd
          kubectl get pods -n dev